name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-core:
    name: Runtime core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile runtime modules
        run: python -m compileall -q wo_runtime

      - name: Run runtime selftest
        run: python bin/wo-runtime selftest

      - name: Compile Telegram assistant plugin
        run: >-
          PYTHONPATH=plugins/telegram-assistant/src
          python -m compileall -q
          plugins/telegram-assistant/src
          plugins/telegram-assistant/tests

      - name: Test Telegram assistant plugin
        run: >-
          PYTHONPATH=plugins/telegram-assistant/src
          python -m unittest discover
          -s plugins/telegram-assistant/tests -v
